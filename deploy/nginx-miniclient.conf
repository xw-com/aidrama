# AIDrama miniclient（菜鸟版手机客户端）nginx 配置片段
# 适配 nginx 1.24.0；include 进现有 server{}（deploy/nginx.conf）即可，
# /api /files /skills 等反代与防盗链块天然共用，无需重复。
#
# 架构:
#   https://your-domain.com/m/  → miniclient/dist (Vant4 手机版, vite base '/m/' 已烘焙)
#
# 部署路径按实际服务器调整:设 AIDrama 根目录为 /usr/share/nginx/xworld-gz/AIDrama

    # ---------- /m/assets:带 hash 的构建产物,长缓存 ----------
    # 前缀最长匹配,优先于下面的 /m/ 块
    location ^~ /m/assets/ {
        alias /usr/share/nginx/xworld-gz/AIDrama/miniclient/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- /douyue/:反向代理到 https://www.douyue.com/ ----------
    # 前缀匹配:/douyue/xxx → https://www.douyue.com/xxx(尾部 / 剥掉本站前缀)
    # 上游为 HTTPS,须开 SNI(proxy_ssl_server_name),否则握手报 502
    # /douyue(无尾斜杠)301 补斜杠,避免相对路径资源落到上级
    location = /douyue {
        return 301 /douyue/;
    }
    location /douyue/ {
        proxy_pass https://www.douyue.com/;
        proxy_http_version 1.1;
        proxy_set_header Host www.douyue.com;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name www.douyue.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_redirect https://www.douyue.com/ /douyue/;
    }

    # ---------- /m/index.html:不缓存,保证发版即生效 ----------
    location = /m/index.html {
        alias /usr/share/nginx/xworld-gz/AIDrama/miniclient/dist/index.html;
        add_header Cache-Control "no-cache";
    }

    # ---------- /m/:Vue history 路由回退 ----------
    # ^~ 前缀匹配:优先于 server 级正则 location(如 /files 媒体签名块),/m/ 下
    # 不会被误接管;alias 与 location 都以 / 结尾,try_files 回退再入本块取 index.html
    location ^~ /m/ {
        alias /usr/share/nginx/xworld-gz/AIDrama/miniclient/dist/;
        index index.html;
        try_files $uri $uri/ /m/index.html;
    }
