# AIDrama 生产部署 nginx 配置方案
# 适配 nginx 1.24.0 (Ubuntu,apt 官方构建)
#
# 架构:
#   nginx (80/443) ─┬─ 静态资源  → client/dist (Vue3 history 路由)
#                   ├─ /api      → 反代 127.0.0.1:3000 (Express)
#                   ├─ /files    → 直读 server/data (生成图片/视频, 4K 大文件)
#                   └─ /skills   → 直读 server/skills
#
# 部署路径按实际服务器调整:设 AIDrama 根目录为 /usr/share/nginx/xworld-gz/AIDrama

upstream aidrama_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;

    # ACME 验证走 80,其余全部跳 https(证书就绪后取消下面 redirect 段注释)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    # location / { return 301 https://$host$request_uri; }

    root /usr/share/nginx/xworld-gz/AIDrama/client/dist;
    index index.html;

    # gzip:JS/CSS/JSON 压缩(图片视频已压缩,不再 gzip)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/javascript image/svg+xml;

    # ---------- H5 微信支付收银台(Express 单文件页) ----------
    # 必须显式代理给 Node,否则会被下方 location / 的 try_files 兜到 SPA index.html,
    # 前端路由再把未知路径跳去 /showcase,收银台永远打不开(微信 JSAPI 支付目录校验也会失败)
    location ~ ^/pay\.(html|css|js)$ {
        proxy_pass http://aidrama_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- API:反代 Express ----------
    location /api/ {
        proxy_pass http://aidrama_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 长轮询:任务中心轮询与流式接口不缓冲、放宽超时
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Express express.json({ limit: '8mb' }) 只约束 JSON body；素材上传(视频 200MB 磁盘流式)
        # 走同一路由前缀,必须放行到 220m,否则线上视频素材上传全部 413
        client_max_body_size 220m;
    }

    # ---------- /files:生成产物直读磁盘,绕过 Node ----------
    # 后端入库均为 /files/ 相对路径,nginx 直出即可,免代理开销。
    # 图片等其余产物公开可读;视频/音频由下方 secure_link 正则块(优先匹配)接管签名校验
    location /files/ {
        alias /usr/share/nginx/xworld-gz/AIDrama/server/data/;
        # 带指纹文件名可长缓存;与 Express maxAge 7d 保持一致
        expires 7d;
        add_header Cache-Control "public";
        # 4K 图/视频较大:线程池异步读盘,避免大文件阻塞 worker
        # (nginx 1.24 用 aio threads;1.25.1+ 才可改用独立的 http2/aio 语义)
        sendfile on;
        tcp_nopush on;
        aio threads;
    }

    # ---------- /files 视频/音频:secure_link 时效签名防盗链 ----------
    # 密钥与后端 server/.env 的 FILE_SIGN_SECRET 一致;扩展名清单与
    # server/src/utils/mediaSign.js 的 MEDIA_EXT_RE 保持同步(上传白名单:mp4/mov/webm/
    # m4v/avi/mkv/ts + mp3/wav/m4a/aac/flac/ogg)。
    # 部署顺序:先给后端配 FILE_SIGN_SECRET 并重启(出口开始带签名),再上线本块——
    # 否则存量媒体链接全部 403。签名算法见 mediaSign.js:md5(expires+解码路径+空格+密钥)→base64url。
    # 密钥不写进本文件(本文件入 SVN):放在未入库的 nginx.secrets.conf 里(见 deploy/nginx.secrets.example.conf),
    # 内容仅一行: set $file_sign_secret "<与后端 FILE_SIGN_SECRET 逐字节一致>";
    include /usr/share/nginx/xworld-gz/AIDrama/deploy/nginx.secrets.conf;
    # 注意:正则 location 优先于上面的 /files/ 前缀块接管请求;alias 在正则 location 中必须用捕获组。
    location ~* ^/files/(?<media_path>.+\.(?:mp4|mov|webm|m4v|avi|mkv|ts|mp3|wav|m4a|aac|flac|ogg))$ {
        alias /usr/share/nginx/xworld-gz/AIDrama/server/data/$media_path;
        secure_link $arg_sign,$arg_expires;
        # 签名串 = 过期时间(秒) + 解码后完整 URI + 空格 + 密钥(变量由上面的 include 提供)
        secure_link_md5 "$secure_link_expires$uri $file_sign_secret";
        if ($secure_link = "") { return 403; }  # 签名缺失/错误
        if ($secure_link = "0")  { return 410; } # 链接已过期
        expires 7d;
        add_header Cache-Control "public";
        sendfile on;
        tcp_nopush on;
        aio threads;
    }

    # ---------- /skills ----------
    location /skills/ {
        alias /usr/share/nginx/xworld-gz/AIDrama/server/skills/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 微信公众号网页授权域名验证文件 ----------
    # 在 mp.weixin.qq.com 配置「网页授权域名」时下载的 MP_verify_*.txt 放到
    # wechat_verify/ 目录下(独立于 client/dist,发版不被清掉);不配会报 10003
    location ~ ^/MP_verify_\w+\.txt$ {
        root /usr/share/nginx/xworld-gz/wechat_verify;
    }

    # ---------- 前端静态资源(带 hash 的构建产物,长缓存) ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 管理后台独立入口(MPA 第二入口 admin.html) ----------
    # /admin 精确匹配补斜杠;深链(/admin/users 等)统一回退 admin.html,
    # 否则会被下方 location / 兜到 index.html,前台路由再把未知路径跳去 /showcase
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        try_files $uri /admin.html;
    }
    location = /admin.html {
        add_header Cache-Control "no-cache";
    }

    # ---------- Vue history 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存,保证发版即生效
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }

    # 站点图标
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}

