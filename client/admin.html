<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理后台 · 星网 XW.COM</title>
    <script>
      // 防主题闪烁：应用加载前按存档偏好挂 html.dark（与前台 stores/theme.js 同键同口径）
      try {
        var m = localStorage.getItem('aidrama-theme');
        var dark = m ? (m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) : true;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { /* 隐私模式等场景忽略 */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/admin/main.js"></script>
  </body>
</html>
